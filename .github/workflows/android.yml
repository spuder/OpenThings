name: Android

# Builds the Capacitor Android app (android/). See docs/android.md#test-builds and #signing.
#   - With the signing secrets (pushes and PRs in this repo): a release APK signed with the OpenThings
#     key, so each build installs over the last and keeps your data. Without them (PRs from forks):
#     a debug APK, signed with the runner's throwaway key.
#   - Every run uploads the APK as a workflow artifact.
#   - Push to main: replaces the APK on the "android-preview" pre-release, the testers' download link.
#   - v* tag (started by the Tag release workflow): attaches the APK to that GitHub release, once
#     the Desktop workflow has published it.
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (scripts/android-keystore.sh makes them).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8's Android Gradle plugin needs JDK 21. The runner already has the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openthings.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets (a PR from a fork?): building a debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          # versionCode: grows with every run (android/app/build.gradle).
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
          # Release tags are "0.4.0"; everything else "0.4.0-preview.123".
          ANDROID_VERSION_SUFFIX: ${{ !startsWith(github.ref, 'refs/tags/v') && format('-preview.{0}', github.run_number) || '' }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/openthings.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Name the APK
        run: |
          set -eu
          ver="$(node -p "require('./package.json').version")"
          mkdir -p out
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            apk="out/OpenThings-$ver-android.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "$apk"
            # The certificate testers can compare against docs/android.md#signing.
            "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | grep -i 'SHA-256'
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/OpenThings-$ver-android-debug.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OpenThings-android
          path: out/*.apk
          if-no-files-found: error

  # Push to main: the latest signed build on the "android-preview" pre-release, at a link that
  # doesn't change: releases/download/android-preview/OpenThings-android.apk (also for Obtainium).
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: android-preview
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenThings-android
          path: out
      - name: Replace the android-preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          cp out/*.apk OpenThings-android.apk
          gh release delete android-preview --cleanup-tag --yes 2>/dev/null || true
          gh release create android-preview OpenThings-android.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Android preview" \
            --notes "The latest Android build from main ($(echo "$GITHUB_SHA" | cut -c1-7), build ${{ github.run_number }}), for testers. It updates in place over earlier preview and release builds. Install and update: https://github.com/${{ github.repository }}/blob/main/docs/android.md#test-builds"

  # v* tag: attach the APK to the release the Desktop workflow publishes for the same tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Require a signed build
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::The release APK wasn't signed; set the Android signing secrets (docs/android.md#signing)."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only commits that reached main (through a reviewed merge) are released, whoever pushed the tag.
      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; only commits merged to main are released."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: OpenThings-android
          path: out
      # The Desktop workflow creates the release after notarizing (several minutes); wait for it
      # rather than racing it to create one.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 80); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
              exit 0
            fi
            sleep 60
          done
          echo "::error::No GitHub release $GITHUB_REF_NAME after 80 minutes; did the Desktop workflow fail?"
          exit 1
