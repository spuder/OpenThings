name: Desktop

# Builds the Tauri desktop app (src-tauri/):
#   - macOS: universal (Apple silicon + Intel) .app and .dmg. On v* tags and manual runs they're
#     signed with the Developer ID certificate and notarized (secrets below); PR builds stay
#     ad-hoc signed. See docs/desktop.md#signing-and-notarization.
#   - Arch Linux (Omarchy): release binary tarball + AppImage, and checks both AUR PKGBUILDs build
# Bundles are uploaded as workflow artifacts. A v* tag also publishes them as a GitHub release and
# bumps the Homebrew cask (see the release job).
on:
  push:
    branches: [desktop-app]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.sign.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      # Sign and notarize on v* tags and manual runs, when the Apple secrets exist (forks and PRs
      # get ad-hoc builds). Secrets: APPLE_CERTIFICATE (base64 .p12 of a "Developer ID
      # Application" certificate), APPLE_CERTIFICATE_PASSWORD, and the App Store Connect API key
      # APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _CONTENT (the .p8), same names as OpenSpool.
      - name: Import Developer ID certificate
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ -z "$APPLE_CERTIFICATE" ] || [ -z "$API_KEY_ID" ]; then
            echo "Not signing: ad-hoc build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE has no \"Developer ID Application\" identity."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          echo "Signing as: $identity"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      # With APPLE_SIGNING_IDENTITY (overrides the ad-hoc "-" in tauri.conf.json) and the API key,
      # Tauri signs the .app with the hardened runtime, notarizes it and staples the ticket.
      - name: Build universal .app and .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.sign.outputs.identity }}
          APPLE_API_KEY: ${{ steps.sign.outputs.enabled == 'true' && secrets.APP_STORE_CONNECT_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.sign.outputs.enabled == 'true' && secrets.APP_STORE_CONNECT_API_ISSUER_ID || '' }}
          APPLE_API_KEY_PATH: ${{ steps.sign.outputs.enabled == 'true' && format('{0}/private_keys/AuthKey_{1}.p8', runner.temp, secrets.APP_STORE_CONNECT_API_KEY_ID) || '' }}
        run: |
          # Empty variables would still count as set; drop them for ad-hoc builds.
          for v in APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
            [ -n "${!v}" ] || unset "$v"
          done
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      # Tauri only notarizes the .app; sign, notarize and staple the .dmg too so it opens offline
      # without a Gatekeeper prompt.
      - name: Notarize .dmg
        if: steps.sign.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -eu
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --wait --timeout 30m \
            --key "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$bundle/macos/OpenThings.app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute -vv "$bundle/macos/OpenThings.app"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Remove signing keychain and API key
        if: always() && steps.sign.outputs.enabled == 'true'
        run: |
          security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - name: Collect bundles
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          # Zip the .app with ditto so permissions, the signature and the stapled ticket survive.
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenThings.app out/OpenThings-macos-universal.app.zip
          codesign -dv --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenThings.app || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThings-macos-universal
          path: out/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # linuxdeploy can't strip binaries built with Arch's newer toolchain (.relr.dyn), and can't
      # mount FUSE inside a container.
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust nodejs npm \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg xdotool openssl \
            curl wget file patchelf squashfs-tools namcap sudo
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build release binary and AppImage
        run: npx tauri build --bundles appimage
      - name: Release tarball (input of openthings-bin)
        run: |
          chmod +x packaging/arch/make-bin-tarball.sh
          packaging/arch/make-bin-tarball.sh "${{ steps.v.outputs.version }}" src-tauri/target/release/openthings out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThings-arch-x86_64
          path: out/*
          if-no-files-found: error

      - name: Check PKGBUILDs (makepkg as an unprivileged user)
        run: |
          set -eux
          ver="${{ steps.v.outputs.version }}"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp -r packaging/arch/openthings packaging/arch/openthings-bin "$work/"
          # makepkg uses an existing source file instead of downloading it: stand in for the
          # published v$ver tag tarball and release asset with this checkout's files. Their
          # checksums differ from the real downloads, so the build skips checksum verification.
          tar --exclude=./node_modules --exclude=./src-tauri/target --exclude=./.git --exclude=./out \
              --transform "s,^\.,OpenThings-$ver," -czf "$work/openthings/openthings-$ver.tar.gz" .
          cp "out/openthings-$ver-linux-x86_64.tar.gz" "$work/openthings-bin/"
          chown -R builder: /home/builder
          for p in openthings-bin openthings; do
            cd "$work/$p"
            # .SRCINFO must match the PKGBUILD.
            sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -
            sudo -u builder makepkg -s --noconfirm --cleanbuild --skipchecksums
            namcap PKGBUILD *.pkg.tar.zst || true
            pacman -Qlp *.pkg.tar.zst
          done
          cd "$work/openthings-bin" && pacman -U --noconfirm *.pkg.tar.zst && test -x /usr/bin/openthings

  # On a v* tag: publish a GitHub release with the bundles, then bump the Homebrew cask in
  # spuder/homebrew-openthings (pushed with the TAP_DEPLOY_KEY deploy key).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a notarized macOS build
        if: needs.macos.outputs.notarized != 'true'
        run: |
          echo "::error::The macOS build wasn't signed and notarized; set the Apple secrets (docs/desktop.md#signing-and-notarization)."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only commits that reached main (through a reviewed merge) are released, whoever pushed the tag.
      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; only commits merged to main are released."
            exit 1
          fi
      - name: Version
        id: v
        run: |
          ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Name release assets
        id: assets
        run: |
          ver="${{ steps.v.outputs.version }}"
          mkdir -p release
          # Stable name the cask downloads.
          cp artifacts/*.dmg "release/OpenThings-$ver-macos-universal.dmg"
          cp artifacts/OpenThings-macos-universal.app.zip "release/OpenThings-$ver-macos-universal.app.zip"
          cp artifacts/openthings-*-linux-x86_64.tar.gz artifacts/*.AppImage release/
          ls -la release
          echo "dmg_sha256=$(sha256sum "release/OpenThings-$ver-macos-universal.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "OpenThings $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Bump Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -eu
          ver="${{ steps.v.outputs.version }}"
          sha="${{ steps.assets.outputs.dmg_sha256 }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:spuder/homebrew-openthings.git tap
          cd tap
          perl -pi -e "s/^  version \".*\"/  version \"$ver\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/openthings.rb
          git diff
          if git diff --quiet; then
            echo "Cask already at $ver."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "openthings $ver"
          git push origin HEAD:main
