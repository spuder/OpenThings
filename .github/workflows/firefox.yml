name: Firefox extension

# The Firefox quick-add extension (extensions/firefox/). See extensions/firefox/README.md.
#   - Pull requests and pushes that touch it: web-ext lint and a build, uploaded as an artifact
#     (load it from about:debugging). Its unit tests run with `npm test` in the Container workflow.
#   - v* tag (started by the Tag release workflow): submits that version to its public listing on
#     addons.mozilla.org, where Mozilla reviews and signs it and Firefox updates installed copies.
#     Nothing waits for the review; check its status in the AMO Developer Hub.
# Secrets: AMO_API_KEY (JWT issuer) and AMO_API_SECRET (JWT secret), from
# https://addons.mozilla.org/developers/addon/api/key/. Without them the submission is skipped.
on:
  push:
    branches: [main]
    # Path filters don't apply to tags, so a v* tag pushed by hand runs this too.
    tags: ['v*']
    paths: [extensions/firefox/**, .github/workflows/firefox.yml]
  pull_request:
    paths: [extensions/firefox/**, .github/workflows/firefox.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_EXT: web-ext@10.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests and the developer README stay out of the package.
      # Not --self-hosted: the add-on is listed on AMO, so lint it the way AMO does.
      - run: npx --yes "$WEB_EXT" lint --source-dir extensions/firefox --ignore-files '*.test.ts' README.md
      - run: npx --yes "$WEB_EXT" build --source-dir extensions/firefox --ignore-files '*.test.ts' README.md --artifacts-dir dist-firefox

      - uses: actions/upload-artifact@v4
        with:
          name: openthings-firefox
          path: dist-firefox/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only commits that reached main (through a reviewed merge) are published, whoever pushed the tag.
      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; only commits merged to main are published."
            exit 1
          fi

      - name: Require the tag to match the extension version
        run: |
          ver="$(node -p "require('./extensions/firefox/manifest.json').version")"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=extensions/firefox/manifest.json::manifest.json has version $ver, but the tag is $GITHUB_REF_NAME; run scripts/bump-version.sh"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -u
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::AMO_API_KEY / AMO_API_SECRET aren't set; skipping addons.mozilla.org."
            exit 0
          fi
          # --approval-timeout 0: hand the version to AMO's review and don't wait for it.
          set +e
          npx --yes "$WEB_EXT" sign --source-dir extensions/firefox --ignore-files '*.test.ts' README.md \
            --artifacts-dir dist-firefox --channel listed --approval-timeout 0 2>&1 | tee sign.log
          status=${PIPESTATUS[0]}
          set -e
          # A version uploaded by hand (or by an earlier run) is already there: nothing to do.
          if [ "$status" != 0 ] && grep -qi 'already exists' sign.log; then
            echo "::notice::$GITHUB_REF_NAME is already on addons.mozilla.org."
            exit 0
          fi
          exit "$status"
