name: Update flake.lock

# Weekly PR that bumps the pinned nixpkgs in flake.lock; the Nix workflow builds it.
# npm and Cargo dependencies are read from package-lock.json and Cargo.lock, so they need no update here.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: 'Update flake.lock'
          pr-labels: dependencies
          # PRs opened with the default GITHUB_TOKEN don't trigger other workflows. Add a
          # FLAKE_LOCK_TOKEN secret (fine-grained PAT: contents + pull requests) so CI runs on them.
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
