name: Pages

# Publishes the product site (site/) at https://spuder.github.io/OpenThings/
# and a live demo of the app at /OpenThings/app/ (data stays in each visitor's browser).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app demo under /OpenThings/app/
        run: npm run build
        env:
          BASE_PATH: /OpenThings/app/
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r dist _site/app
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (source: GitHub Actions) on first run if the token is allowed to.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
