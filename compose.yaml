# Deploy OpenThings from GHCR, exposed on the tailnet by DockTail
# (https://github.com/marvinvr/docktail) at https://openthings.<tailnet>.ts.net.
# No host ports are published. To build locally instead: docker build -t openthings .
services:
  openthings:
    image: ghcr.io/spuder/openthings:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: UTC # your time zone, e.g. America/Denver: "today" for the REST API and MCP tools
      # The address your devices use. Apps prefill it in Settings → Sync and put it in the
      # phone pairing QR code. With DockTail: https://openthings.<your tailnet>.ts.net
      # OPENTHINGS_PUBLIC_URL: https://openthings.example.ts.net
    volumes:
      - openthings-data:/data # the synced database; back this up
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=openthings"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"

volumes:
  openthings-data:
