server {
  listen 8080;
  root /usr/share/nginx/html;

  # sql.js needs the correct MIME type to stream-compile WebAssembly.
  types { application/wasm wasm; application/manifest+json webmanifest; }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The sync server (REST, sync, MCP) isn't in this image yet: answer API paths with JSON, not the app page.
  location ~ ^/(api|mcp)(/|$) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"No OpenThings sync server here yet: this container only serves the web app"}';
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
