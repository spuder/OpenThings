<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OpenThings</title>
  <link rel="stylesheet" href="popup.css" />
  <script type="module" src="popup.js"></script>
</head>
<body>
  <form id="form">
    <header>
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <span class="name">OpenThings</span>
      <span id="mode" class="mode">App</span>
    </header>
    <textarea id="text" rows="2" placeholder="New to-do… @fri #errand +House" required autofocus></textarea>
    <!-- Icons: the app's own Inbox and Brain Dump glyphs from src/lib/ui/Icon.svelte. -->
    <div class="target" role="radiogroup" aria-label="Add to">
      <label><input type="radio" name="target" value="inbox" checked /><span><svg class="icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 5.2 4.6A1.5 1.5 0 0 1 6.6 3.5h6.8a1.5 1.5 0 0 1 1.4 1.1L17 11.5v3.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15z" /><path d="M3 11.5h4l1 2h4l1-2h4" /></svg>Inbox</span></label>
      <label><input type="radio" name="target" value="dump" /><span><svg class="icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h8l3 3v10.5a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V3.5A.5.5 0 0 1 5 3z" /><path d="M7.5 8.5c1.2-.6 2.4.6 3.6 0s2.2-.4 2.4 0M7.5 12c1.2-.6 2.4.6 3.6 0" /></svg>Brain Dump</span></label>
    </div>
    <label class="page"><input type="checkbox" id="includePage" /> Attach this page's link</label>
    <div class="buttons">
      <button type="button" id="open" class="secondary">Open OpenThings</button>
      <button type="submit" id="add">Add</button>
    </div>
    <p id="status" role="status"></p>
    <footer><a href="#" id="settings">Settings</a><span class="hint">Enter adds · Shift+Enter new line</span></footer>
  </form>
</body>
</html>
