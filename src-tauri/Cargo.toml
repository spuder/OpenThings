[package]
name = "openthings"
version = "0.4.1"
description = "OpenThings desktop app: a native shell around the local-first web app"
authors = ["OpenThings contributors"]
license = "MIT"
repository = "https://github.com/spuder/OpenThings"
edition = "2021"
rust-version = "1.80"

[lib]
name = "openthings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
